<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 84" width="280" height="84">
  <!-- Relogio da Cifra (60 ANOS - Quadro-negro metalico com giz branco) -->
  <polygon points="8,4 272,4 276,8 276,76 272,80 8,80 4,76 4,8" fill="#13191E" stroke="#4D6673" stroke-width="2.5"/>
  <rect x="12" y="12" width="256" height="60" fill="#182026" stroke="#2D3C45" stroke-width="1.5"/>
  <!-- Risco de giz / formula apagada ao fundo -->
  <path d="M18,24 Q90,22 162,25" stroke="#80DEEA" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <text x="20" y="24" font-family="Consolas, monospace" font-size="11" fill="#80DEEA" letter-spacing="1.5">CIFRA // RECÁLCULO</text>
  <!-- Circulo rabiscado a giz em volta de 60 -->
  <ellipse cx="76" cy="49" rx="46" ry="20" fill="none" stroke="#E0F7FA" stroke-width="2" stroke-dasharray="14 3 9 2" transform="rotate(-3 76 49)"/>
  <!-- Digitos 6 0 em giz vetorial -->
  <g fill="none" stroke="#E0F7FA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 6 -->
    <path d="M64,34 C50,34 44,44 45,56 C46,64 64,65 65,55 C65,47 50,47 46,52"/>
    <!-- 0 -->
    <path d="M84,35 C76,35 75,63 86,63 C98,63 97,35 84,35 Z"/>
  </g>
  <text x="140" y="54" font-family="Consolas, monospace" font-size="18" font-weight="bold" fill="#00E5FF" letter-spacing="2">ANOS</text>
  <text x="140" y="67" font-family="Consolas, monospace" font-size="9" fill="#80DEEA">Δ ORBITAL (-11a)</text>
</svg>
