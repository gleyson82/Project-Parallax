<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Reticula de Telemetria Vertical do Olhar do Phantom (Kinesys - Cristal de Nitrogenio) -->
  <g fill="none" stroke="#00E5FF" stroke-opacity="0.55">
    <!-- Moldura prismatica nos cantos superiores (foco no teto e vigas) -->
    <path d="M40,140 V40 H260" stroke-width="3"/>
    <path d="M1880,140 V40 H1660" stroke-width="3"/>
    <path d="M40,940 V1040 H200" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M1880,940 V1040 H1720" stroke-width="2" stroke-opacity="0.35"/>

    <!-- Escala Telemetrica Vertical Esquerda (Altitude em metros: 0m a +100m) -->
    <line x1="72" y1="180" x2="72" y2="900" stroke-width="2"/>
    <g stroke-width="2">
      <line x1="72" y1="180" x2="108" y2="180"/>
      <line x1="72" y1="270" x2="94" y2="270"/>
      <line x1="72" y1="360" x2="108" y2="360"/>
      <line x1="72" y1="450" x2="94" y2="450"/>
      <line x1="72" y1="540" x2="116" y2="540" stroke="#FFB300"/>
      <line x1="72" y1="630" x2="94" y2="630"/>
      <line x1="72" y1="720" x2="108" y2="720"/>
      <line x1="72" y1="810" x2="94" y2="810"/>
      <line x1="72" y1="900" x2="108" y2="900"/>
    </g>

    <!-- Escala Direita (Intervalo de Geiseres & Tensão de Cabo) -->
    <line x1="1848" y1="180" x2="1848" y2="900" stroke-width="2"/>
    <g stroke-width="2">
      <line x1="1812" y1="180" x2="1848" y2="180"/>
      <line x1="1826" y1="300" x2="1848" y2="300"/>
      <line x1="1812" y1="420" x2="1848" y2="420"/>
      <line x1="1804" y1="540" x2="1848" y2="540" stroke="#FFB300"/>
      <line x1="1812" y1="660" x2="1848" y2="660"/>
      <line x1="1826" y1="780" x2="1848" y2="780"/>
      <line x1="1812" y1="900" x2="1848" y2="900"/>
    </g>

    <!-- Reticula superior discreta de mira de arpeu -->
    <path d="M900,88 H948 M972,88 H1020 M960,64 V80" stroke-width="2"/>
    <circle cx="960" cy="88" r="18" stroke-dasharray="6 4" stroke-width="1.5"/>
  </g>

  <!-- Rotulos Telemetricos -->
  <g font-family="Consolas, monospace" font-size="14" fill="#00E5FF" fill-opacity="0.72">
    <text x="116" y="185">+100m // VIGAS</text>
    <text x="116" y="365">+50m // PASSARELA</text>
    <text x="124" y="545" fill="#FFB300">0m // PLANO ÓTICO</text>
    <text x="116" y="725">-25m // CALDEIRA</text>
    <text x="116" y="905">-50m // FOSSO</text>

    <text x="1635" y="185">ÓTICA KINESYS // -235 °C</text>
    <text x="1675" y="425">CABO: 18.0m MAX</text>
    <text x="1660" y="545" fill="#FFB300">GÊISER: CICLO 08s</text>
    <text x="1655" y="905">CRISTAL N2: ATIVO</text>
  </g>
</svg>
